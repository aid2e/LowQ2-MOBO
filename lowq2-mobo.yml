name: lowq2-mobo
channels:
  - conda-forge
dependencies:
  - python=3.11.5
  - pip
  - pip:
    - ax-platform==1.0.0
    - torch
    - pandas
    - numpy
    - matplotlib
    - seaborn
    - wandb
    - botorch

    # BIC/LowQ2 framework
    - git+https://github.com/aid2e/BICLowQ2-framework.git

    # Scheduler (base version without PanDA support)
    - scheduler[slurm] @ git+https://github.com/aid2e/scheduler_epic.git

    # Additional dependencies
    - cloudpickle
    - joblib
